name: contribution-snake

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-purple.svg?color_snake=#a34dff&color_dots=#1b1030,#3b1d63,#5b2a96,#8448c3,#d7a8ff
      - name: Publish to output branch
        run: |
          # dist/ is root-owned (written by the snk container), so publish from a copy
          mkdir out && cp dist/* out/ && cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "update contribution snake"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
